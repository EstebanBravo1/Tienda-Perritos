name: Deploy Fullstack to AWS EC2

on:
  push:
    branches:
      - main

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Execute Backend commands via AWS SSM
        run: |
          aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --instance-ids "${{ secrets.AWS_INSTANCE_ID_BACKEND }}" \
            --region us-east-1 \
            --comment "Desplegando el Backend" \
            --parameters 'commands=[
              "mkdir -p /home/ssm-user/innova-backend",
              "cd /home/ssm-user/innova-backend",
              "echo \"PORT=3000\" > .env",
              "echo \"DB_HOST=172.31.23.202\" >> .env",
              "echo \"DB_USER=root\" >> .env",
              "echo \"DB_PASSWORD=admin123\" >> .env",
              "echo \"DB_NAME=tienda_perritos\" >> .env",
              "echo \"DB_PORT=3306\" >> .env",
              "cat << \"EOF\" > Dockerfile",
              "FROM node:18-alpine AS builder",
              "WORKDIR /app",
              "COPY package*.json ./",
              "RUN npm install --production",
              "FROM node:18-alpine",
              "WORKDIR /app",
              "USER node",
              "COPY --chown=node:node --from=builder /app/node_modules ./node_modules",
              "COPY --chown=node:node . .",
              "EXPOSE 3000",
              "CMD [\"node\", \"server.js\"]",
              "EOF",
              "cat << \"EOF\" > package.json",
              "{\"name\":\"innova-backend\",\"version\":\"1.0.0\",\"main\":\"server.js\",\"dependencies\":{\"cors\":\"^2.8.5\",\"dotenv\":\"^16.0.3\",\"express\":\"^4.18.2\",\"mysql2\":\"^3.2.0\"}}",
              "EOF",
              "cat << \"EOF\" > server.js",
              "const express = require(\"express\"); const cors = require(\"cors\"); const mysql = require(\"mysql2/promise\"); require(\"dotenv\").config(); const app = express(); const PORT = process.env.PORT || 3000; const { DB_HOST, DB_USER, DB_PASSWORD, DB_NAME, DB_PORT } = process.env; app.use(cors()); app.use(express.json()); let pool; async function initDb() { try { pool = mysql.createPool({ host: DB_HOST, user: DB_USER, password: DB_PASSWORD, database: DB_NAME, port: DB_PORT, waitForConnections: true, connectionLimit: 10, queueLimit: 0 }); console.log(\"Pool de conexiones MySQL inicializado.\"); } catch (err) { console.error(\"Error al inicializar pool de MySQL:\", err); } } initDb(); app.get(\"/api/productos\", async (req, res) => { try { const [rows] = await pool.query(\"SELECT * FROM productos\"); res.json(rows); } catch (err) { res.status(500).json({ error: err.message }); } }); app.listen(PORT, () => console.log(\"Servidor corriendo en puerto \" + PORT));",
              "EOF",
              "docker stop innova-backend-container || true",
              "docker rm innova-backend-container || true",
              "docker build -t innova-backend .",
              "docker run -d --name innova-backend-container -p 3000:3000 --restart always innova-backend"
            ]'

  deploy-frontend:
    runs-on: ubuntu-latest
    needs: deploy-backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Execute Frontend commands via AWS SSM
        run: |
          aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --instance-ids "${{ secrets.AWS_INSTANCE_ID_FRONTEND }}" \
            --region us-east-1 \
            --comment "Instalando Docker y Desplegando el Frontend" \
            --parameters 'commands=[
              "sudo dnf update -y || sudo yum update -y",
              "sudo dnf install -y docker || sudo yum install -y docker",
              "sudo systemctl start docker",
              "sudo systemctl enable docker",
              "sudo usermod -aG docker ssm-user || true",
              "mkdir -p /home/ssm-user/innova-frontend",
              "cd /home/ssm-user/innova-frontend",
              "cat << \"EOF\" > index.html",
              "<!DOCTYPE html><html lang=\"es\"><head><meta charset=\"UTF-8\"><title>Tienda Perritos</title></head><body><h1>Nuestros Alimentos</h1><div id=\"productos\"></div><script src=\"app.js\"></script></body></html>",
              "EOF",
              "cat << \"EOF\" > app.js",
              "const API_BASE = \"http://54.196.145.47:3000\"; async function cargarProductos() { try { const res = await fetch(`${API_BASE}/api/productos`); const data = await res.json(); const container = document.getElementById(\"productos\"); container.innerHTML = data.map(p => `<p><strong>${p.nombre}</strong> - ${p.descripcion} ($${p.precio})</p>`).join(\"\"); } catch (e) { console.error(e); } } cargarProductos();",
              "EOF",
              "cat << \"EOF\" > Dockerfile",
              "FROM nginx:alpine",
              "COPY . /usr/share/nginx/html/",
              "EXPOSE 80",
              "CMD [\"nginx\", \"-g\", \"daemon off;\"]",
              "EOF",
              "sudo docker stop innova-frontend-container || true",
              "sudo docker rm innova-frontend-container || true",
              "sudo docker build -t innova-frontend .",
              "sudo docker run -d --name innova-frontend-container -p 80:80 --restart always innova-frontend"
            ]'